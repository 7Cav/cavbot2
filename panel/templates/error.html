{{define "content"}}
<main class="body" data-failure="{{.Failure}}">
  <h1 class="title">{{.Title}}</h1>
  <div class="block narrow">
    <div class="block-row"><p>{{.Message}}</p></div>
    <div class="submit-row">{{if .SignInAgain}}<form method="post" action="/auth/start"><button type="submit" class="btn btn--cta">Sign in again</button></form>{{else}}<a class="btn" href="{{.Retry}}" data-retry>Try again</a>{{end}}</div>
  </div>
</main>
{{end}}
