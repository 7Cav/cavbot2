{{define "content"}}
<main class="body" data-failure="{{.Failure}}">
  <h1 class="title">{{.Title}}</h1>
  <div class="block narrow">
    <div class="block-row"><p>{{.Message}}</p></div>
    <div class="submit-row"><a class="btn" href="{{.Retry}}" data-retry>Try again</a></div>
  </div>
</main>
{{end}}
