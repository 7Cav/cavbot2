# golangci-lint v2 config.
#
# `linters.default: standard` keeps the standard linter set (errcheck, govet,
# ineffassign, staticcheck, unused) as it was before this file existed.
# depguard and gosec on top of it hold the panel's security rules, so review
# needn't. forbidigo holds the panel's production code to its clock and to
# registering routes only through routes(), and the commands package's error
# replies to refuse and replyError, and nolintlint makes every //nolint name
# its linter and say why.
#
# gofmt is a *formatter* in v2, not a linter: `golangci-lint run` reports diffs
# as issues, and `golangci-lint fmt` rewrites them in place.
#
# Caveat: the default `uniq-by-line` processor keeps only the first issue per
# line, so another linter firing on the same line hides the gofmt one until it
# is fixed. Harmless as a gate — the masking issue fails the build on its own.
version: "2"

linters:
  default: standard
  enable:
    - depguard
    - forbidigo
    - gosec
    - nolintlint
  settings:
    depguard:
      rules:
        panel-pages:
          files:
            - "**/panel/**"
          deny:
            - pkg: text/template
              desc: panel pages render with html/template, which escapes each value for where it lands
    gosec:
      # G201 and G202 catch SQL built from values by formatting or
      # concatenation: queries take values as parameters. G201 misses a
      # fmt.Sprintf written inside the Query or Exec call itself, so
      # CODING_STANDARDS.md leaves that shape to review. G203 catches a value
      # converted to template.HTML, which html/template then leaves unescaped.
      includes:
        - G201
        - G202
        - G203
    forbidigo:
      analyze-types: true
      forbid:
        # The panel reads the time, sets its deadlines and waits through
        # panelClock (panel/clock.go), so its tests run it on a clock they
        # move and never wait out a time budget (#480). A read that has to
        # use the wall clock carries a //nolint:forbidigo that says why.
        - pattern: ^time\.(Now|Since|Until|After|AfterFunc|Sleep|Tick|NewTicker|NewTimer)$
          msg: read the time and wait through panelClock
        - pattern: ^context\.(WithTimeout|WithTimeoutCause|WithDeadline|WithDeadlineCause)$
          msg: set deadlines through panelClock.WithTimeout
        # The panel serves the routes routes() lists and no others. Handler
        # builds its one mux from that list, and the test that every route has
        # an outsider case reads it (#546). A route registered anywhere else,
        # or a second mux that could serve one, would pass that test unseen.
        # The calls that build the served mux carry a //nolint:forbidigo.
        - pattern: ^(http\.NewServeMux|http\.Handle|http\.HandleFunc|http\.ServeMux\.(Handle|HandleFunc))$
          pkg: ^net/http$
          msg: add the route to routes(), the one list of routes the panel serves
        # A command sends its error replies through refuse and replyError
        # (commands/interaction_ack.go), which send through acknowledge, so
        # Discord's 10062 on a command's first response reaches Sentry as a
        # missed acknowledgement with its timings (#514, #544).
        - pattern: ^utils\.HandleError$
          pkg: ^github\.com/7cav/cavbot2/utils$
          msg: send a command's error reply through refuse when it turns the run down before the command acts on it, or through replyError for any other error reply
    nolintlint:
      require-explanation: true
      require-specific: true

  exclusions:
    rules:
      # Each forbidigo rule holds one package's production code, so each
      # exclusion matches its own rule's message. The panel's clock rules
      # and its route rule are for panel/ alone.
      - path-except: ^panel/
        linters: [forbidigo]
        text: panelClock
      - path-except: ^panel/
        linters: [forbidigo]
        text: routes\(\)
      # The error reply rule is for commands/ alone, outside the file that
      # holds refuse and replyError.
      - path-except: ^commands/
        linters: [forbidigo]
        text: replyError
      - path: ^commands/interaction_ack\.go$
        linters: [forbidigo]
        text: replyError
      - path: _test\.go$
        linters: [forbidigo]

formatters:
  enable:
    - gofmt
