# golangci-lint v2 config.
#
# `linters.default: standard` keeps the standard linter set (errcheck, govet,
# ineffassign, staticcheck, unused) as it was before this file existed.
# depguard and gosec on top of it hold the panel's security rules, so review
# needn't. forbidigo holds the panel's production code to its clock, and
# nolintlint makes every //nolint name its linter and say why.
#
# gofmt is a *formatter* in v2, not a linter: `golangci-lint run` reports diffs
# as issues, and `golangci-lint fmt` rewrites them in place.
#
# Caveat: the default `uniq-by-line` processor keeps only the first issue per
# line, so another linter firing on the same line hides the gofmt one until it
# is fixed. Harmless as a gate — the masking issue fails the build on its own.
version: "2"

linters:
  default: standard
  enable:
    - depguard
    - forbidigo
    - gosec
    - nolintlint
  settings:
    depguard:
      rules:
        panel-pages:
          files:
            - "**/panel/**"
          deny:
            - pkg: text/template
              desc: panel pages render with html/template, which escapes each value for where it lands
    gosec:
      # G201 and G202 catch SQL built from values by formatting or
      # concatenation: queries take values as parameters. G201 misses a
      # fmt.Sprintf written inside the Query or Exec call itself, so
      # CODING_STANDARDS.md leaves that shape to review. G203 catches a value
      # converted to template.HTML, which html/template then leaves unescaped.
      includes:
        - G201
        - G202
        - G203
    forbidigo:
      # The panel reads the time, sets its deadlines and waits through
      # panelClock (panel/clock.go), so its tests run it on a clock they move
      # and never wait out a time budget (#480). A read that has to use the
      # wall clock carries a //nolint:forbidigo that says why.
      analyze-types: true
      forbid:
        - pattern: ^time\.(Now|Since|Until|After|AfterFunc|Sleep|Tick|NewTicker|NewTimer)$
          msg: read the time and wait through panelClock
        - pattern: ^context\.(WithTimeout|WithTimeoutCause|WithDeadline|WithDeadlineCause)$
          msg: set deadlines through panelClock.WithTimeout
    nolintlint:
      require-explanation: true
      require-specific: true

  exclusions:
    rules:
      # forbidigo's rules are the panel's, for its production code alone.
      - path-except: ^panel/
        linters: [forbidigo]
      - path: _test\.go$
        linters: [forbidigo]

formatters:
  enable:
    - gofmt
