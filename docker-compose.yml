services:
  cavbot2:
    image: cavbot2:latest
    container_name: cavbot2
#    restart: unless-stopped
    environment:
      BEARER: ${BEARER}
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      GUILD_ID: ${GUILD_ID}
      BM_TOKEN: ${BM_TOKEN}
# Codespace and ENV level Secret for BM_TOKEN
      LOG_LEVEL: ${LOG_LEVEL}
      DISCORDGO_LOG_LEVEL: ${DISCORDGO_LOG_LEVEL}
      FORUM_DB_DSN: ${FORUM_DB_DSN}
      LOA_NODE_IDS: ${LOA_NODE_IDS}
      WARDEN_ROLE_BASE_NAME: ${WARDEN_ROLE_BASE_NAME}
      SENTRY_DSN: ${SENTRY_DSN}
      APP_ENV: ${APP_ENV}
    networks:
      - xenforo_internal

networks:
  xenforo_internal:
    external: true
