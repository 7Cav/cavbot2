services:
  cavbot2:
    image: cavbot2:latest
    container_name: cavbot2
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BEARER: ${BEARER}
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      GUILD_ID: ${GUILD_ID}
      BM_TOKEN: ${BM_TOKEN}
# Codespace and ENV level Secret for BM_TOKEN
      LOG_LEVEL: ${LOG_LEVEL}
      DISCORDGO_LOG_LEVEL: ${DISCORDGO_LOG_LEVEL}
      FORUM_DB_DSN: ${FORUM_DB_DSN}
      LOA_NODE_IDS: ${LOA_NODE_IDS}
      WARDEN_ROLE_BASE_NAME: ${WARDEN_ROLE_BASE_NAME}
      SENTRY_DSN: ${SENTRY_DSN}
      APP_ENV: ${APP_ENV}
      BOT_DB_DSN: ${BOT_DB_DSN}
    networks:
      - xenforo_internal
      - cavbot_internal

  # The bot's own database. Migrations run inside the bot at startup (ADR
  # 0012), so this service only has to be healthy before the bot starts.
  postgres:
    image: postgres:18-alpine
    container_name: cavbot2-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: cavbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: cavbot
    volumes:
      # Postgres 18 moved the image's data volume from /var/lib/postgresql/data
      # to /var/lib/postgresql. A mount at the old path lands outside the volume.
      - cavbot2_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cavbot -d cavbot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      # A bot release must not restart the database. Watchtower's /v1/update
      # touches every container it watches; this label removes this one.
      com.centurylinklabs.watchtower.enable: "false"
    networks:
      - cavbot_internal

volumes:
  cavbot2_pgdata:

networks:
  xenforo_internal:
    external: true
  cavbot_internal:
