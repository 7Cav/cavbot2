name: Lint and Build

on:
  workflow_dispatch:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: latest
          args: --timeout=5m

  build:
    needs: lint
    name: Build
    runs-on: ubuntu-latest

    # The store package's tests run against a real Postgres (ADR 0012). The
    # same major as production, reached on localhost because the job runs on
    # the runner, not in a container.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: cavbot
          POSTGRES_PASSWORD: cavbot
          POSTGRES_DB: cavbot_test
        options: >-
          --health-cmd "pg_isready -U cavbot -d cavbot_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Verify module files are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Run tests with coverage
        env:
          TEST_BOT_DB_DSN: postgres://cavbot:cavbot@localhost:5432/cavbot_test?sslmode=disable
        run: |
          set -euo pipefail
          go test ./... -race -cover -covermode=atomic | tee /tmp/cover.log

      - name: Enforce coverage floors
        run: ./.github/scripts/check-coverage-floors.sh < /tmp/cover.log

      - name: Test build
        run: go build -o cavbot2
