name: Lint and Build

on:
  workflow_dispatch:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

# Both jobs run this golangci-lint, the one you run locally and gate.sh
# picks up, so a new release cannot fail CI on code that passed the gate.
# Dependabot does not bump it. Change it when you upgrade locally.
env:
  GOLANGCI_LINT_VERSION: v2.14.0

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      # Lints on the Go the Dockerfile's golang tag names, with the module
      # cache, as Build does. The image builds on that Go too. setup-go reads a
      # version only from go.mod and its kin, so a step reads the tag first.
      - name: Read the Go from the Dockerfile
        id: go
        run: |
          version=$(.github/scripts/check-image-go.sh Dockerfile go.mod)
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ steps.go.outputs.version }}

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --timeout=5m

  # Runs the same gate.sh agents run locally, so the two cannot drift. It
  # lints too, so a lint failure shows here as well as in Lint. Both check
  # names are required on develop, which is why Lint stays its own job: its
  # action caches golangci-lint's results and annotates the PR diff.
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      # The gate runs on the Go the Dockerfile's golang tag names, so install
      # that one rather than have Go download it again.
      - name: Read the Go from the Dockerfile
        id: go
        run: |
          version=$(.github/scripts/check-image-go.sh Dockerfile go.mod)
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ steps.go.outputs.version }}

      # gate.sh runs golangci-lint itself. setup-go's problem matcher reads its
      # output, so lint findings still annotate the diff.
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          install-only: true

      # The mixer's contract test runs the real ffmpeg, and fails rather than
      # skips under Actions, so a runner without it can't pass the gate.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      # gate.sh starts its own Postgres for the store tests through Docker,
      # which the runner provides.
      - name: Run the gate
        run: ./.github/scripts/gate.sh
